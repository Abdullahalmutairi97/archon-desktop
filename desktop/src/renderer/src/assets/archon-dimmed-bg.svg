      <stop offset=".66" stop-color="#141b22" stop-opacity=".18"/>
      <stop offset="1" stop-color="#070b0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stoneA" x1=".1" y1=".1" x2=".9" y2=".9">
