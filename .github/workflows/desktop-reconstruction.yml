name: Authored reconstruction source build

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-reconstruction.yml'
      - '.node-version'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    paths:
      - '.github/workflows/desktop-reconstruction.yml'
      - '.node-version'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    name: P2A typecheck, fixture tests, and source build
    runs-on: ubuntu-24.04
    container:
      # Official node image, resolved from the Docker Registry on 2026-09-26.
      # Pin the OCI index digest so CI selects a fixed linux/amd64 image.
      image: node:24.21.0-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    defaults:
      run:
        working-directory: desktop
    env:
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Install Git for source checkout and package provenance
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci
      - run: npm run ci
      - name: Show source and emitted-file SHA-256 inventory
        run: cat out/build-manifest.json
      - name: Build portable Linux x64 reconstruction preview
        run: npm run package:portable
      - name: Verify portable preview checksum
        shell: bash
        working-directory: desktop/release
        run: |
          shopt -s nullglob
          bundles=(Archon-Desktop-Reconstruction-*-linux-x64.tar.gz)
          checksums=(Archon-Desktop-Reconstruction-*-linux-x64.tar.gz.sha256)
          if [[ ${#bundles[@]} -ne 1 || ${#checksums[@]} -ne 1 ]]; then
            echo "Expected exactly one reconstruction tarball and checksum sidecar." >&2
            exit 1
          fi
          sha256sum --check "${checksums[0]}"
      - name: Upload non-release reconstruction preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: archon-desktop-reconstruction-preview-not-a-release
          path: |
            desktop/release/Archon-Desktop-Reconstruction-*-linux-x64.tar.gz
            desktop/release/Archon-Desktop-Reconstruction-*-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
